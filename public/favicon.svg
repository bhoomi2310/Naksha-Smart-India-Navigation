<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="nakshaOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="60%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <filter id="arrowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Orange Background Squircle -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#nakshaOrange)"/>
  
  <!-- Subtle Highlight Border -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="13.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Solid White Arrow (Lucide Navigation pointing northeast, perfectly centered) -->
  <g transform="translate(9.5, 11.3) scale(1.8)" filter="url(#arrowShadow)">
    <polygon points="3 11 22 2 13 21 11 13 3 11" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.8" stroke-linejoin="round"/>
  </g>
</svg>
